AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Aweborn.org — VPS infrastructure for k3s cluster.
  Provisions a Lightsail instance with static IP, firewall rules,
  k3s + Docker bootstrap via UserData, and Route53 DNS records
  for sync.aweborn.org and api.aweborn.org.

Parameters:
  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID for aweborn.org

  InstanceBundle:
    Type: String
    Default: small_3_0
    Description: >
      Lightsail bundle ID. small_3_0 = 2GB RAM, 2 vCPU, 60GB SSD, $12/mo.
      See: aws lightsail get-bundles
    AllowedValues:
      - micro_3_0
      - small_3_0
      - medium_3_0

  AvailabilityZone:
    Type: String
    Default: us-east-1a
    Description: AZ for the Lightsail instance

Resources:
  # ============================================
  # Lightsail — VPS Instance
  # ============================================
  VPSInstance:
    Type: AWS::Lightsail::Instance
    Properties:
      InstanceName: aweborn-vps
      BlueprintId: ubuntu_22_04
      BundleId: !Ref InstanceBundle
      AvailabilityZone: !Ref AvailabilityZone
      # SSH key — Lightsail creates a default key pair per region.
      # To use a custom key, create it first via:
      #   aws lightsail create-key-pair --key-pair-name aweborn-ssh
      # Then uncomment:
      # KeyPairName: aweborn-ssh
      Networking:
        Ports:
          # SSH — closed to the public internet (2026-10-03).
          # Day-to-day access is over the Tailnet: `ssh ubuntu@aweborn-vps`.
          # Tailscale rides WireGuard over outbound UDP, so it is not
          # affected by this firewall.
          # Break-glass: only the Lightsail browser SSH console (AWS-auth'd)
          # may reach port 22 publicly, via the `lightsail-connect` alias.
          # Applied to the live instance 2026-10-03 via
          # `aws lightsail put-instance-public-ports` (not a stack update),
          # because CloudFormation flagged a UserData update on this
          # resource. The stack's recorded state still lists 0.0.0.0/0 —
          # always deploy THIS template, never an older copy.
          - FromPort: 22
            ToPort: 22
            Protocol: tcp
            Cidrs: []
            Ipv6Cidrs: []
            CidrListAliases:
              - lightsail-connect
            AccessType: public
          # HTTP — for Caddy ACME challenge + redirect
          - FromPort: 80
            ToPort: 80
            Protocol: tcp
            AccessFrom: '0.0.0.0/0'
            AccessType: public
          # HTTPS — main traffic (WSS + HTTPS)
          - FromPort: 443
            ToPort: 443
            Protocol: tcp
            AccessFrom: '0.0.0.0/0'
            AccessType: public
          # k3s API — intentionally NOT exposed to public internet.
          # Access via SSH tunnel: ssh -L 6443:localhost:6443 ubuntu@aweborn-vps
      UserData: |
        #!/bin/sh
        # Cloud-init runs this with /bin/sh — re-exec under bash for pipefail support
        if [ -z "$BASH_VERSION" ]; then
          exec /bin/bash "$0" "$@"
        fi
        set -euo pipefail
        exec > /var/log/aweborn-bootstrap.log 2>&1
        echo "=== Aweborn VPS bootstrap starting at $(date) ==="

        # ── System updates ───────────────────────────────────────
        apt-get update -y
        apt-get upgrade -y

        # ── Install Docker ───────────────────────────────────────
        curl -fsSL https://get.docker.com | sh
        usermod -aG docker ubuntu

        # ── Install Tailscale ─────────────────────────────────────
        curl -fsSL https://tailscale.com/install.sh | sh
        # To auto-join the Tailnet on boot, set the TAILSCALE_AUTHKEY
        # parameter and uncomment the next line:
        # tailscale up --authkey="${TAILSCALE_AUTHKEY}" --hostname=aweborn-vps

        # ── Install k3s (without Traefik — we use Caddy) ────────
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable=traefik" sh -

        # Wait for k3s to be ready
        echo "Waiting for k3s node to be ready..."
        until k3s kubectl get nodes | grep -q ' Ready'; do
          sleep 5
        done
        echo "k3s node is ready"

        # ── Clone repo ───────────────────────────────────────────
        git clone https://github.com/aweborn/aweborn.org.git /home/ubuntu/aweborn
        chown -R ubuntu:ubuntu /home/ubuntu/aweborn

        # ── Namespace + placeholder secret (only if none exists) ─
        # Never overwrite a real secret; set real values with
        # kubectl create secret ... (see infra/k3s/secrets.example.yaml).
        k3s kubectl apply -f /home/ubuntu/aweborn/infra/k3s/namespace.yaml
        k3s kubectl -n aweborn get secret aweborn-secrets >/dev/null 2>&1 \
          || k3s kubectl apply -f /home/ubuntu/aweborn/infra/k3s/secrets.example.yaml

        # ── Build, smoke-test and deploy every service ──────────
        # Same script CI uses (infra/k3s/deploy-services.sh).
        sudo -u ubuntu -H REPO_DIR=/home/ubuntu/aweborn \
          bash /home/ubuntu/aweborn/infra/k3s/deploy-services.sh all

        echo "=== Aweborn VPS bootstrap complete at $(date) ==="

  # ============================================
  # Lightsail — Static IP
  # ============================================
  VPSStaticIp:
    Type: AWS::Lightsail::StaticIp
    DependsOn: VPSInstance
    Properties:
      StaticIpName: aweborn-vps-ip
      AttachedTo: aweborn-vps

  # ============================================
  # Route53 — DNS Records for VPS services
  # ============================================
  SyncDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: sync.aweborn.org
      Type: A
      TTL: '300'
      ResourceRecords:
        - !GetAtt VPSStaticIp.IpAddress
    DependsOn: VPSStaticIp

  ApiDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: api.aweborn.org
      Type: A
      TTL: '300'
      ResourceRecords:
        - !GetAtt VPSStaticIp.IpAddress
    DependsOn: VPSStaticIp

# ============================================
# Outputs
# ============================================
Outputs:
  InstanceName:
    Description: Lightsail instance name
    Value: !Ref VPSInstance

  StaticIpAddress:
    Description: Static IP address of the VPS
    Value: !GetAtt VPSStaticIp.IpAddress

  SyncServiceUrl:
    Description: Sync service URL (WSS)
    Value: wss://sync.aweborn.org

  ApiServiceUrl:
    Description: API service URL (HTTPS)
    Value: https://api.aweborn.org

  SSHCommand:
    Description: SSH command to connect to the VPS (Tailnet only; public port 22 is closed)
    Value: 'ssh ubuntu@aweborn-vps'

  BootstrapLogCommand:
    Description: Command to check bootstrap progress on the VPS
    Value: 'sudo tail -f /var/log/aweborn-bootstrap.log'
