AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Aweborn.org — Static website hosting with S3, CloudFront, ACM, Route53,
  and a serverless Stripe Checkout API (API Gateway + Lambda).
  MUST be deployed in us-east-1 (ACM requirement for CloudFront).

Parameters:
  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID for aweborn.org

  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: sk_test_placeholder
    Description: Stripe Secret Key (use test key initially)

  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: whsec_placeholder
    Description: Signing secret of the Stripe webhook endpoint (infra/stripe-webhook.sh create; then infra/set-stack-key.sh stripe-webhook)

  ManaInflowToken:
    Type: String
    NoEcho: true
    Default: placeholder
    Description: Bearer token for sync.aweborn.org POST /api/mana/inflow (gifts only). Same value as MANA_INFLOW_TOKEN on the VPS (infra/set-stack-key.sh mana-inflow)

Resources:
  # ============================================
  # S3 — Static Site Content Bucket
  # ============================================
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: aweborn-website-content
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ============================================
  # CloudFront — Origin Access Control (OAC)
  # ============================================
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: aweborn-oac
        Description: OAC for aweborn.org S3 bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ============================================
  # S3 — Bucket Policy (CloudFront OAC access)
  # ============================================
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ============================================
  # ACM — TLS Certificate
  # ============================================
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: aweborn.org
      SubjectAlternativeNames:
        - '*.aweborn.org'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: aweborn.org
          HostedZoneId: !Ref HostedZoneId

  # ============================================
  # CloudFront — Distribution
  # ============================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: aweborn.org website
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3

        Aliases:
          - aweborn.org
          - www.aweborn.org

        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD

        # SPA routing — serve index.html for 403/404
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300

  # ============================================
  # Route53 — DNS Records
  # ============================================
  DNSRecordApex:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: aweborn.org
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront global hosted zone ID
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

  DNSRecordWww:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: www.aweborn.org
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

  # ============================================
  # Lambda — Stripe Checkout Session Creator
  # ============================================
  StripeCheckoutRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aweborn-stripe-checkout-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  StripeCheckoutFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aweborn-stripe-checkout
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt StripeCheckoutRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          SITE_URL: https://aweborn.org
      Code:
        ZipFile: |
          const https = require('https');

          const ALLOWED_ORIGINS = [
            'https://aweborn.org',
            'https://www.aweborn.org'
          ];

          function corsHeaders(origin) {
            const allowed = ALLOWED_ORIGINS.includes(origin) ? origin : ALLOWED_ORIGINS[0];
            return {
              'Access-Control-Allow-Origin': allowed,
              'Access-Control-Allow-Headers': 'Content-Type',
              'Access-Control-Allow-Methods': 'POST, OPTIONS',
              'Content-Type': 'application/json'
            };
          }

          function stripeRequest(path, data, apiKey) {
            return new Promise((resolve, reject) => {
              const postData = new URLSearchParams(data).toString();
              const options = {
                hostname: 'api.stripe.com',
                port: 443,
                path: path,
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/x-www-form-urlencoded',
                  'Content-Length': Buffer.byteLength(postData)
                }
              };

              const req = https.request(options, (res) => {
                let body = '';
                res.on('data', (chunk) => body += chunk);
                res.on('end', () => {
                  try {
                    resolve(JSON.parse(body));
                  } catch (e) {
                    reject(new Error('Failed to parse Stripe response'));
                  }
                });
              });

              req.on('error', reject);
              req.write(postData);
              req.end();
            });
          }

          exports.handler = async (event) => {
            const origin = event.headers?.origin || '';
            const headers = corsHeaders(origin);
            const path = event.requestContext?.http?.path || '';

            // Handle CORS preflight
            if (event.requestContext?.http?.method === 'OPTIONS') {
              return { statusCode: 200, headers, body: '' };
            }

            try {
              const body = JSON.parse(event.body || '{}');
              const amount = parseInt(body.amount, 10);
              const currency = body.currency || 'usd';

              if (!amount || amount < 100) {
                return {
                  statusCode: 400,
                  headers,
                  body: JSON.stringify({ error: 'Minimum donation is $1.00' })
                };
              }

              // --- Route: Create PaymentIntent (embedded Elements flow) ---
              if (path.endsWith('/create-payment-intent')) {
                const paymentIntent = await stripeRequest('/v1/payment_intents', {
                  'amount': amount.toString(),
                  'currency': currency,
                  'automatic_payment_methods[enabled]': 'true',
                  'description': 'Donation to Aweborn',
                  'metadata[source]': 'aweborn.org',
                  'metadata[kind]': 'donation'
                }, process.env.STRIPE_SECRET_KEY);

                if (paymentIntent.error) {
                  console.error('Stripe error:', paymentIntent.error);
                  return {
                    statusCode: 500,
                    headers,
                    body: JSON.stringify({ error: 'Failed to initialize payment' })
                  };
                }

                return {
                  statusCode: 200,
                  headers,
                  body: JSON.stringify({ clientSecret: paymentIntent.client_secret })
                };
              }

              // --- Route: Create Checkout Session (redirect fallback) ---
              const siteUrl = process.env.SITE_URL || 'https://aweborn.org';

              const session = await stripeRequest('/v1/checkout/sessions', {
                'mode': 'payment',
                'line_items[0][price_data][currency]': currency,
                'line_items[0][price_data][product_data][name]': 'Donation to Aweborn',
                'line_items[0][price_data][unit_amount]': amount.toString(),
                'line_items[0][quantity]': '1',
                'success_url': `${siteUrl}?donation=success`,
                'cancel_url': `${siteUrl}?donation=cancelled`,
                'submit_type': 'donate',
                'payment_intent_data[metadata][source]': 'aweborn.org',
                'payment_intent_data[metadata][kind]': 'donation'
              }, process.env.STRIPE_SECRET_KEY);

              if (session.error) {
                console.error('Stripe error:', session.error);
                return {
                  statusCode: 500,
                  headers,
                  body: JSON.stringify({ error: 'Failed to create checkout session' })
                };
              }

              return {
                statusCode: 200,
                headers,
                body: JSON.stringify({ url: session.url })
              };
            } catch (err) {
              console.error('Handler error:', err);
              return {
                statusCode: 500,
                headers,
                body: JSON.stringify({ error: 'Internal server error' })
              };
            }
          };

  StripeCheckoutFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StripeCheckoutFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PaymentApi}/*'

  # ============================================
  # Lambda — Stripe webhook → mana ledger (Phase 05)
  # Each live donation (payment_intent.succeeded, metadata kind=donation)
  # becomes a gift in the universe's pool: net of Stripe fees, idempotent on
  # the payment intent id. Only the amount and date leave Stripe, never the
  # donor's name or email. Non-2xx → Stripe retries for up to 3 days.
  # ============================================
  StripeWebhookRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aweborn-stripe-webhook-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  StripeWebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aweborn-stripe-webhook
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt StripeWebhookRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          MANA_INFLOW_TOKEN: !Ref ManaInflowToken
          SYNC_URL: https://sync.aweborn.org
      Code:
        ZipFile: |
          const crypto = require('crypto');
          const STRIPE_API = process.env.STRIPE_API_BASE || 'https://api.stripe.com';
          const TOLERANCE_S = 300;
          const reply = (statusCode, msg) => {
            console.log(statusCode, msg);
            return { statusCode, headers: { 'Content-Type': 'text/plain' }, body: msg };
          };

          // Stripe-Signature: t=<unix>,v1=<hex hmac of "t.body">[,v1=...]
          function verify(raw, header, secret) {
            if (!header || !secret || !secret.startsWith('whsec_') || secret === 'whsec_placeholder') return false;
            let t = null; const sigs = [];
            for (const part of header.split(',')) {
              const i = part.indexOf('=');
              const k = part.slice(0, i).trim(), v = part.slice(i + 1).trim();
              if (k === 't') t = v; else if (k === 'v1') sigs.push(v);
            }
            if (!t || !sigs.length || Math.abs(Date.now() / 1000 - Number(t)) > TOLERANCE_S) return false;
            const want = crypto.createHmac('sha256', secret).update(t + '.' + raw).digest();
            return sigs.some((s) => {
              const got = Buffer.from(s, 'hex');
              return got.length === want.length && crypto.timingSafeEqual(got, want);
            });
          }

          exports.handler = async (event) => {
            const raw = event.isBase64Encoded ? Buffer.from(event.body || '', 'base64').toString('utf8') : (event.body || '');
            const headers = event.headers || {};
            if (!verify(raw, headers['stripe-signature'], process.env.STRIPE_WEBHOOK_SECRET)) return reply(400, 'bad signature');

            const evt = JSON.parse(raw);
            if (evt.type !== 'payment_intent.succeeded') return reply(200, 'ignored ' + evt.type);
            const pi = evt.data.object;
            if (!pi.metadata || pi.metadata.source !== 'aweborn.org' || pi.metadata.kind !== 'donation') return reply(200, 'not a donation ' + pi.id);
            if (!evt.livemode && process.env.ALLOW_TEST_EVENTS !== 'true') return reply(200, 'test mode, not recorded ' + pi.id);

            // Net after Stripe's fee lives on the charge's balance transaction.
            const r = await fetch(STRIPE_API + '/v1/payment_intents/' + encodeURIComponent(pi.id) + '?expand[]=latest_charge.balance_transaction', {
              headers: { Authorization: 'Bearer ' + process.env.STRIPE_SECRET_KEY }
            });
            const full = await r.json().catch(() => ({}));
            const bt = full.latest_charge && full.latest_charge.balance_transaction;
            if (!r.ok || !bt || typeof bt.net !== 'number') return reply(503, 'balance transaction not ready ' + pi.id);
            if (bt.currency !== 'usd') return reply(500, 'unexpected settlement currency ' + bt.currency);

            const res = await fetch(process.env.SYNC_URL + '/api/mana/inflow', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + process.env.MANA_INFLOW_TOKEN },
              body: JSON.stringify({ source: 'gift', netDollars: bt.net / 100, ref: pi.id, at: pi.created * 1000 })
            });
            const text = await res.text();
            if (!res.ok) return reply(502, 'ledger refused ' + res.status + ' ' + text.slice(0, 200));
            return reply(200, (text.includes('"duplicate"') ? 'already recorded ' : 'recorded ') + pi.id + ' net $' + (bt.net / 100).toFixed(2));
          };

  StripeWebhookFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StripeWebhookFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PaymentApi}/*'

  # ============================================
  # API Gateway — HTTP API for Stripe
  # ============================================
  PaymentApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: aweborn-payment-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - https://aweborn.org
          - https://www.aweborn.org
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type # API Gateway stores header names lowercased; anything else reads as drift
        MaxAge: 86400

  PaymentApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PaymentApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StripeCheckoutFunction.Arn
      PayloadFormatVersion: '2.0'

  PaymentApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PaymentApi
      RouteKey: POST /create-checkout-session
      Target: !Sub 'integrations/${PaymentApiIntegration}'

  PaymentIntentApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PaymentApi
      RouteKey: POST /create-payment-intent
      Target: !Sub 'integrations/${PaymentApiIntegration}'

  StripeWebhookIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PaymentApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StripeWebhookFunction.Arn
      PayloadFormatVersion: '2.0'

  StripeWebhookRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PaymentApi
      RouteKey: POST /stripe-webhook
      Target: !Sub 'integrations/${StripeWebhookIntegration}'

  PaymentApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PaymentApi
      StageName: $default
      AutoDeploy: true

# ============================================
# Outputs
# ============================================
Outputs:
  DistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution

  DistributionDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName

  BucketName:
    Description: S3 Bucket Name
    Value: !Ref SiteBucket

  ApiEndpoint:
    Description: API Gateway endpoint URL for Stripe Checkout
    Value: !GetAtt PaymentApi.ApiEndpoint
