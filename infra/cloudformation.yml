AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Aweborn.org — Static website hosting with S3, CloudFront, ACM, Route53,
  and a serverless Stripe Checkout API (API Gateway + Lambda).
  MUST be deployed in us-east-1 (ACM requirement for CloudFront).

Parameters:
  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID for aweborn.org

  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: sk_test_placeholder
    Description: Stripe Secret Key (use test key initially)

  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: whsec_placeholder
    Description: Signing secret of the Stripe webhook endpoint (infra/stripe-webhook.sh create; then infra/set-stack-key.sh stripe-webhook)

  ManaInflowToken:
    Type: String
    NoEcho: true
    Default: placeholder
    Description: Bearer token for sync.aweborn.org POST /api/mana/inflow (gifts only). Same value as MANA_INFLOW_TOKEN on the VPS (infra/set-stack-key.sh mana-inflow)

  CardPriceId:
    Type: String
    Default: ''
    Description: Stripe Price id (price_…) of the $9 card, live mode (M6). Empty = card checkout answers "not on sale yet"

Resources:
  # ============================================
  # S3 — Static Site Content Bucket
  # ============================================
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: aweborn-website-content
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ============================================
  # CloudFront — Origin Access Control (OAC)
  # ============================================
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: aweborn-oac
        Description: OAC for aweborn.org S3 bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ============================================
  # S3 — Bucket Policy (CloudFront OAC access)
  # ============================================
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ============================================
  # ACM — TLS Certificate
  # ============================================
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: aweborn.org
      SubjectAlternativeNames:
        - '*.aweborn.org'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: aweborn.org
          HostedZoneId: !Ref HostedZoneId

  # ============================================
  # CloudFront — Distribution
  # ============================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: aweborn.org website
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3

        Aliases:
          - aweborn.org
          - www.aweborn.org

        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD

        # SPA routing — serve index.html for 403/404
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300

  # ============================================
  # Route53 — DNS Records
  # ============================================
  DNSRecordApex:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: aweborn.org
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront global hosted zone ID
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

  DNSRecordWww:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: www.aweborn.org
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

  # ============================================
  # Lambda — Stripe Checkout Session Creator
  # ============================================
  StripeCheckoutRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aweborn-stripe-checkout-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  StripeCheckoutFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aweborn-stripe-checkout
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt StripeCheckoutRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          SITE_URL: https://aweborn.org
          # Card checkout (M6): asks sync what an order is, never trusts the browser
          CARD_PRICE_ID: !Ref CardPriceId
          CARD_UNIT_CENTS: '900'
          MANA_INFLOW_TOKEN: !Ref ManaInflowToken
          SYNC_URL: https://sync.aweborn.org
      Code:
        ZipFile: |
          const https = require('https');
          const ALLOWED_ORIGINS = ['https://aweborn.org', 'https://www.aweborn.org'];

          function corsHeaders(origin) {
            return {
              'Access-Control-Allow-Origin': ALLOWED_ORIGINS.includes(origin) ? origin : ALLOWED_ORIGINS[0],
              'Access-Control-Allow-Headers': 'Content-Type',
              'Access-Control-Allow-Methods': 'POST, OPTIONS',
              'Content-Type': 'application/json'
            };
          }

          function stripeRequest(path, data, apiKey) {
            return new Promise((resolve, reject) => {
              const postData = new URLSearchParams(data).toString();
              const req = https.request({
                hostname: 'api.stripe.com', port: 443, path, method: 'POST',
                headers: { Authorization: `Bearer ${apiKey}`, 'Content-Type': 'application/x-www-form-urlencoded', 'Content-Length': Buffer.byteLength(postData) }
              }, (res) => {
                let body = '';
                res.on('data', (chunk) => body += chunk);
                res.on('end', () => { try { resolve(JSON.parse(body)); } catch (e) { reject(new Error('Failed to parse Stripe response')); } });
              });
              req.on('error', reject);
              req.write(postData);
              req.end();
            });
          }

          exports.handler = async (event) => {
            const headers = corsHeaders(event.headers?.origin || '');
            const path = event.requestContext?.http?.path || '';
            const out = (statusCode, obj) => ({ statusCode, headers, body: JSON.stringify(obj) });
            if (event.requestContext?.http?.method === 'OPTIONS') return { statusCode: 200, headers, body: '' };

            try {
              const body = JSON.parse(event.body || '{}');

              // Card checkout (M6): { orderId } → Stripe Checkout for that order, at the card price
              if (path.endsWith('/create-card-checkout')) {
                const orderId = String(body.orderId || '');
                if (!/^o[0-9a-f]{24}$/.test(orderId)) return out(400, { error: 'bad_order' });
                if (!process.env.CARD_PRICE_ID) return out(503, { error: 'cards_not_on_sale', message: 'Card orders open soon.' });
                const r = await fetch(process.env.SYNC_URL + '/api/cards/checkout-info/' + orderId, { headers: { Authorization: 'Bearer ' + process.env.MANA_INFLOW_TOKEN } });
                if (r.status === 404) return out(400, { error: 'order_closed', message: 'This order is closed. Start a new one.' });
                if (!r.ok) return out(502, { error: 'sync_unavailable' });
                const o = await r.json();
                // The Stripe price must be the price players see
                const pr = await fetch('https://api.stripe.com/v1/prices/' + encodeURIComponent(process.env.CARD_PRICE_ID), { headers: { Authorization: 'Bearer ' + process.env.STRIPE_SECRET_KEY } }).then((x) => x.json());
                if (pr.unit_amount !== Number(process.env.CARD_UNIT_CENTS) || pr.unit_amount !== o.unitCents || pr.currency !== 'usd' || !pr.active) {
                  console.error('card price mismatch', pr.id, pr.unit_amount, pr.currency, pr.active);
                  return out(503, { error: 'cards_not_on_sale', message: 'Card orders open soon.' });
                }
                const siteUrl = process.env.SITE_URL || 'https://aweborn.org';
                const session = await stripeRequest('/v1/checkout/sessions', {
                  mode: 'payment',
                  'line_items[0][price]': process.env.CARD_PRICE_ID,
                  'line_items[0][quantity]': String(o.quantity),
                  client_reference_id: o.id,
                  'shipping_address_collection[allowed_countries][0]': 'US',
                  'custom_text[submit][message]': 'Card of “' + String(o.worldName).slice(0, 60) + '” × ' + o.quantity + '. A person checks every card before it prints.',
                  success_url: siteUrl + '/order.html?o=' + o.id,
                  cancel_url: siteUrl + '/order.html?o=' + o.id + '&cancelled=1',
                  'payment_intent_data[description]': 'Aweborn card of ' + String(o.worldName).slice(0, 60),
                  'payment_intent_data[metadata][source]': 'aweborn.org',
                  'payment_intent_data[metadata][kind]': 'card',
                  'payment_intent_data[metadata][order_id]': o.id,
                  'payment_intent_data[metadata][world_id]': o.worldId
                }, process.env.STRIPE_SECRET_KEY);
                if (session.error) { console.error('Stripe error:', session.error); return out(500, { error: 'Failed to create checkout session' }); }
                return out(200, { url: session.url });
              }
              const amount = parseInt(body.amount, 10);
              const currency = body.currency || 'usd';
              if (!amount || amount < 100) return out(400, { error: 'Minimum donation is $1.00' });
              // Opt-in name for the golden wave (the server cleans it again); omitted = anonymous.
              const name = typeof body.displayName === 'string' ? body.displayName.trim().slice(0, 20) : '';
              const meta = (prefix) => {
                const m = { [prefix + '[source]']: 'aweborn.org', [prefix + '[kind]']: 'donation' };
                if (name) m[prefix + '[display_name]'] = name;
                return m;
              };

              // Embedded Elements flow
              if (path.endsWith('/create-payment-intent')) {
                const pi = await stripeRequest('/v1/payment_intents', {
                  amount: amount.toString(), currency,
                  'automatic_payment_methods[enabled]': 'true',
                  description: 'Donation to Aweborn',
                  ...meta('metadata')
                }, process.env.STRIPE_SECRET_KEY);
                if (pi.error) { console.error('Stripe error:', pi.error); return out(500, { error: 'Failed to initialize payment' }); }
                return out(200, { clientSecret: pi.client_secret });
              }

              // Checkout Session (redirect fallback)
              const siteUrl = process.env.SITE_URL || 'https://aweborn.org';
              const session = await stripeRequest('/v1/checkout/sessions', {
                mode: 'payment',
                'line_items[0][price_data][currency]': currency,
                'line_items[0][price_data][product_data][name]': 'Donation to Aweborn',
                'line_items[0][price_data][unit_amount]': amount.toString(),
                'line_items[0][quantity]': '1',
                success_url: `${siteUrl}?donation=success`,
                cancel_url: `${siteUrl}?donation=cancelled`,
                submit_type: 'donate',
                ...meta('payment_intent_data[metadata]')
              }, process.env.STRIPE_SECRET_KEY);
              if (session.error) { console.error('Stripe error:', session.error); return out(500, { error: 'Failed to create checkout session' }); }
              return out(200, { url: session.url });
            } catch (err) {
              console.error('Handler error:', err);
              return out(500, { error: 'Internal server error' });
            }
          };

  StripeCheckoutFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StripeCheckoutFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PaymentApi}/*'

  # ============================================
  # Lambda — Stripe webhook → mana ledger (Phase 05)
  # Each live donation (payment_intent.succeeded, metadata kind=donation)
  # becomes a gift in the universe's pool: net of Stripe fees, idempotent on
  # the payment intent id. Only the amount and date leave Stripe (plus a
  # display name only when the giver opted in to show it in the golden wave),
  # never the donor's email. Refunds and lost disputes (charge.refunded,
  # charge.dispute.funds_withdrawn) become labeled draws, bounded by the gift
  # (M4, 2026-10-27). Non-2xx → Stripe retries for up to 3 days.
  # ============================================
  StripeWebhookRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aweborn-stripe-webhook-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  StripeWebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aweborn-stripe-webhook
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt StripeWebhookRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          MANA_INFLOW_TOKEN: !Ref ManaInflowToken
          SYNC_URL: https://sync.aweborn.org
      Code:
        ZipFile: |
          const crypto = require('crypto');
          const STRIPE_API = process.env.STRIPE_API_BASE || 'https://api.stripe.com';
          const TOLERANCE_S = 300;
          const reply = (statusCode, msg) => {
            console.log(statusCode, msg);
            return { statusCode, headers: { 'Content-Type': 'text/plain' }, body: msg };
          };
          const ledger = (path, body) => fetch(process.env.SYNC_URL + path, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + process.env.MANA_INFLOW_TOKEN }, body: JSON.stringify(body) });

          function verify(raw, header, secret) {
            if (!header || !secret || !secret.startsWith('whsec_') || secret === 'whsec_placeholder') return false;
            let t = null; const sigs = [];
            for (const part of header.split(',')) {
              const i = part.indexOf('=');
              const k = part.slice(0, i).trim(), v = part.slice(i + 1).trim();
              if (k === 't') t = v; else if (k === 'v1') sigs.push(v);
            }
            if (!t || !sigs.length || Math.abs(Date.now() / 1000 - Number(t)) > TOLERANCE_S) return false;
            const want = crypto.createHmac('sha256', secret).update(t + '.' + raw).digest();
            return sigs.some((s) => {
              const got = Buffer.from(s, 'hex');
              return got.length === want.length && crypto.timingSafeEqual(got, want);
            });
          }

          exports.handler = async (event) => {
            const raw = event.isBase64Encoded ? Buffer.from(event.body || '', 'base64').toString('utf8') : (event.body || '');
            if (!verify(raw, (event.headers || {})['stripe-signature'], process.env.STRIPE_WEBHOOK_SECRET)) return reply(400, 'bad signature');
            const evt = JSON.parse(raw), o = evt.data.object, t = evt.type, prev = evt.data.previous_attributes || {};
            if (!evt.livemode && process.env.ALLOW_TEST_EVENTS !== 'true') return reply(200, 'test mode ' + t);
            // Refund / lost dispute: a labeled draw, bounded by the gift on the server.
            if (t === 'charge.refunded' || t === 'charge.dispute.funds_withdrawn') {
              const d = t !== 'charge.refunded', cents = d ? o.amount : o.amount_refunded - (prev.amount_refunded || 0);
              if (!o.payment_intent || !(cents > 0)) return reply(200, 'ignored ' + t);
              const res = await ledger('/api/mana/refund', { giftRef: o.payment_intent, refundRef: d ? o.id : o.id + ':' + o.amount_refunded, dollars: cents / 100, dispute: d });
              const text = await res.text();
              return reply(res.ok || res.status === 409 ? 200 : 502, t + ' ' + res.status + ' ' + text.slice(0, 120));
            }
            // Link etc. attach the net after payment_intent.succeeded; charge.updated says when.
            let piId;
            if (t === 'payment_intent.succeeded') piId = o.id;
            else if (t === 'charge.updated' && o.payment_intent && 'balance_transaction' in prev && o.balance_transaction) piId = o.payment_intent;
            else return reply(200, 'ignored ' + t);

            const r = await fetch(STRIPE_API + '/v1/payment_intents/' + encodeURIComponent(piId) + '?expand[]=latest_charge.balance_transaction', {
              headers: { Authorization: 'Bearer ' + process.env.STRIPE_SECRET_KEY }
            });
            const pi = await r.json().catch(() => ({}));
            if (!r.ok || !pi.id) return reply(503, 'could not load payment intent ' + piId);
            if (!pi.metadata || pi.metadata.source !== 'aweborn.org' || (pi.metadata.kind !== 'donation' && pi.metadata.kind !== 'card')) return reply(200, 'not ours ' + pi.id);
            const bt = pi.latest_charge && pi.latest_charge.balance_transaction;
            if (!bt || typeof bt.net !== 'number') return reply(503, 'balance transaction not ready ' + pi.id);
            if (bt.currency !== 'usd') return reply(500, 'unexpected settlement currency ' + bt.currency);

            // Card order (M6): sync books the inflow (creative share after production + shipping) and marks the order paid.
            // The buyer's email goes along only for order notices; the shipping address stays in Stripe.
            if (pi.metadata.kind === 'card') {
              const email = (pi.latest_charge.billing_details && pi.latest_charge.billing_details.email) || pi.receipt_email || undefined;
              const res = await ledger('/api/cards/paid', { orderId: pi.metadata.order_id, ref: pi.id, netDollars: bt.net / 100, email, at: pi.created * 1000 });
              const text = await res.text();
              if (!res.ok) return reply(502, 'cards refused ' + res.status + ' ' + text.slice(0, 200));
              return reply(200, (text.includes('"duplicate":true') ? 'already recorded card ' : 'recorded card ') + pi.id);
            }

            const body = { source: 'gift', netDollars: bt.net / 100, ref: pi.id, at: pi.created * 1000 };
            if (pi.metadata.display_name) body.publicName = pi.metadata.display_name;
            const res = await ledger('/api/mana/inflow', body);
            const text = await res.text();
            if (!res.ok) return reply(502, 'ledger refused ' + res.status + ' ' + text.slice(0, 200));
            return reply(200, (text.includes('"duplicate"') ? 'already recorded ' : 'recorded ') + pi.id + ' net $' + (bt.net / 100).toFixed(2));
          };

  StripeWebhookFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StripeWebhookFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PaymentApi}/*'

  # ============================================
  # API Gateway — HTTP API for Stripe
  # ============================================
  PaymentApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: aweborn-payment-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - https://aweborn.org
          - https://www.aweborn.org
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type # API Gateway stores header names lowercased; anything else reads as drift
        MaxAge: 86400

  PaymentApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PaymentApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StripeCheckoutFunction.Arn
      PayloadFormatVersion: '2.0'

  PaymentApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PaymentApi
      RouteKey: POST /create-checkout-session
      Target: !Sub 'integrations/${PaymentApiIntegration}'

  PaymentIntentApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PaymentApi
      RouteKey: POST /create-payment-intent
      Target: !Sub 'integrations/${PaymentApiIntegration}'

  CardCheckoutApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PaymentApi
      RouteKey: POST /create-card-checkout
      Target: !Sub 'integrations/${PaymentApiIntegration}'

  StripeWebhookIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PaymentApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StripeWebhookFunction.Arn
      PayloadFormatVersion: '2.0'

  StripeWebhookRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PaymentApi
      RouteKey: POST /stripe-webhook
      Target: !Sub 'integrations/${StripeWebhookIntegration}'

  PaymentApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PaymentApi
      StageName: $default
      AutoDeploy: true

# ============================================
# Outputs
# ============================================
Outputs:
  DistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution

  DistributionDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName

  BucketName:
    Description: S3 Bucket Name
    Value: !Ref SiteBucket

  ApiEndpoint:
    Description: API Gateway endpoint URL for Stripe Checkout
    Value: !GetAtt PaymentApi.ApiEndpoint
