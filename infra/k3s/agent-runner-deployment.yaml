apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runner
  namespace: aweborn
  labels:
    app: agent-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-runner
  template:
    metadata:
      labels:
        app: agent-runner
    spec:
      containers:
        - name: agent-runner
          image: ghcr.io/aweborn/agent-runner:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
              protocol: TCP
          env:
            - name: PORT
              value: "3002"
            - name: HOST
              value: "0.0.0.0"
            - name: DATA_DIR
              value: "/app/data"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aweborn-secrets
                  key: LLM_API_KEY
                  optional: true
            - name: LLM_MODEL
              value: "gpt-4o-mini"
            - name: LLM_API_URL
              value: "https://api.openai.com/v1/chat/completions"
          volumeMounts:
            - name: agent-data
              mountPath: /app/data
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: agent-runner-data
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runner
  namespace: aweborn
  labels:
    app: agent-runner
spec:
  selector:
    app: agent-runner
  ports:
    - port: 3002
      targetPort: 3002
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-runner-data
  namespace: aweborn
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
