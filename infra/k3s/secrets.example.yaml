# Placeholder for the VPS secret `aweborn-secrets`. Do NOT put real values here.
# The VPS bootstrap applies this file only when no secret exists yet, so every
# service starts (auth disabled, optional features hidden) until real values
# are set. Set or rotate real values with infra/set-secret.sh (see CONFIG.md,
# which lists every secret, where it lives and how to rotate it).

apiVersion: v1
kind: Secret
metadata:
  name: aweborn-secrets
  namespace: aweborn
type: Opaque
stringData:
  # sync-service player identity (Better Auth). REPLACE_ME = auth disabled.
  # Losing or rotating the real value signs everyone out; anonymous players lose
  # their identity for good. Keep a copy in the password manager.
  BETTER_AUTH_SECRET: "REPLACE_ME"
  # agent-runner LLM key (optional while agents are unused).
  LLM_API_KEY: "REPLACE_ME"
  # Optional, missing = feature hidden:
  # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET   Sign in with Google
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY email sign-in codes via SES (IAM user aweborn-mail-sender)
  # Not here: the Stripe secret key lives in the aweborn-website stack (Lambda), not on the VPS.
