apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-service
  namespace: aweborn
  labels:
    app: genai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genai-service
  template:
    metadata:
      labels:
        app: genai-service
    spec:
      volumes:
        # Job table, generated assets and the creation archive live on the VPS
        # disk (survive redeploys). Moves to S3 + CloudFront later (Phase 07).
        - name: genai-data
          hostPath:
            path: /var/lib/aweborn/genai-data
            type: DirectoryOrCreate
      initContainers:
        - name: fix-data-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1001:1001 /data"]
          volumeMounts:
            - name: genai-data
              mountPath: /data
      containers:
        - name: genai-service
          image: ghcr.io/aweborn/genai-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
              protocol: TCP
          env:
            - name: PORT
              value: "3001"
            - name: HOST
              value: "0.0.0.0"
            - name: DATA_DIR
              value: /data
            # Missing key = stub provider (sample model), so a deploy before
            # the secret exists still starts. infra/set-secret.sh push MESHY_API_KEY
            - name: MESHY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aweborn-secrets
                  key: MESHY_API_KEY
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aweborn-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
            # Asset library (infra/cloudformation-assets.yml). Missing key = files stay on the box only.
            - name: ASSETS_BUCKET
              value: aweborn-assets-111551045759
            - name: ASSETS_CDN_URL
              value: https://assets.aweborn.org
            - name: AWS_REGION
              value: us-east-1
            - name: ASSETS_AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aweborn-secrets
                  key: ASSETS_AWS_ACCESS_KEY_ID
                  optional: true
            - name: ASSETS_AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aweborn-secrets
                  key: ASSETS_AWS_SECRET_ACCESS_KEY
                  optional: true
          volumeMounts:
            - name: genai-data
              mountPath: /data
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: genai-service
  namespace: aweborn
  labels:
    app: genai-service
spec:
  selector:
    app: genai-service
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
  type: ClusterIP
