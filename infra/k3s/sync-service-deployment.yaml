apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-service
  namespace: aweborn
  labels:
    app: sync-service
spec:
  replicas: 1
  # SQLite has a single writer: never run old + new pods at the same time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sync-service
  template:
    metadata:
      labels:
        app: sync-service
    spec:
      # Time for SIGTERM → rooms.shutdown() to flush all docs to SQLite.
      terminationGracePeriodSeconds: 30
      volumes:
        # World data lives on the VPS disk, outside k8s lifecycle: survives
        # redeploys, pod/namespace deletion. (local-path PVCs use
        # reclaimPolicy Delete, which would erase every world.)
        - name: sync-data
          hostPath:
            path: /var/lib/aweborn/sync-data
            type: DirectoryOrCreate
      initContainers:
        # hostPath dirs are created root-owned; the app runs as uid 1001.
        - name: fix-data-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1001:1001 /data"]
          volumeMounts:
            - name: sync-data
              mountPath: /data
      containers:
        - name: sync-service
          image: ghcr.io/aweborn/sync-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 1234
              protocol: TCP
          env:
            - name: PORT
              value: "1234"
            - name: HOST
              value: "0.0.0.0"
            - name: DB_PATH
              value: /data/universe.db
          volumeMounts:
            - name: sync-data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 1234
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 1234
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sync-service
  namespace: aweborn
  labels:
    app: sync-service
spec:
  selector:
    app: sync-service
  ports:
    - port: 1234
      targetPort: 1234
      protocol: TCP
  type: ClusterIP
