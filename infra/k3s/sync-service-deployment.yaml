apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-service
  namespace: aweborn
  labels:
    app: sync-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sync-service
  template:
    metadata:
      labels:
        app: sync-service
    spec:
      containers:
        - name: sync-service
          image: ghcr.io/aweborn/sync-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 1234
              protocol: TCP
          env:
            - name: PORT
              value: "1234"
            - name: HOST
              value: "0.0.0.0"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 1234
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 1234
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sync-service
  namespace: aweborn
  labels:
    app: sync-service
spec:
  selector:
    app: sync-service
  ports:
    - port: 1234
      targetPort: 1234
      protocol: TCP
  type: ClusterIP
