apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-service
  namespace: aweborn
  labels:
    app: sync-service
spec:
  replicas: 1
  # SQLite has a single writer: never run old + new pods at the same time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sync-service
  template:
    metadata:
      labels:
        app: sync-service
    spec:
      # Time for SIGTERM → rooms.shutdown() to flush all docs to SQLite.
      terminationGracePeriodSeconds: 30
      volumes:
        # World data lives on the VPS disk, outside k8s lifecycle: survives
        # redeploys, pod/namespace deletion. (local-path PVCs use
        # reclaimPolicy Delete, which would erase every world.)
        - name: sync-data
          hostPath:
            path: /var/lib/aweborn/sync-data
            type: DirectoryOrCreate
      initContainers:
        # hostPath dirs are created root-owned; the app runs as uid 1001.
        - name: fix-data-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1001:1001 /data"]
          volumeMounts:
            - name: sync-data
              mountPath: /data
      containers:
        - name: sync-service
          image: ghcr.io/aweborn/sync-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 1234
              protocol: TCP
          env:
            - name: PORT
              value: "1234"
            - name: HOST
              value: "0.0.0.0"
            - name: DB_PATH
              value: /data/universe.db
          volumeMounts:
            - name: sync-data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 1234
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 1234
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sync-service
  namespace: aweborn
  labels:
    app: sync-service
spec:
  selector:
    app: sync-service
  ports:
    - port: 1234
      targetPort: 1234
      protocol: TCP
  type: ClusterIP
---
# Hourly universe.db snapshots (server/sync-service/src/backup.ts).
# Lives in this file so deploy-services.sh pins it to the same image SHA as
# the Deployment. Snapshots go to a SEPARATE hostPath from the live data, so
# wiping sync-data never takes the backups with it. Off-box copy: daily,
# pulled by .github/workflows/backup.yml. Restore: infra/backup/restore-sync-db.sh
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-backup
  namespace: aweborn
  labels:
    app: sync-backup
spec:
  schedule: "7 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: sync-backup
        spec:
          restartPolicy: Never
          volumes:
            - name: sync-data
              hostPath:
                path: /var/lib/aweborn/sync-data
                type: Directory
            - name: backups
              hostPath:
                path: /var/lib/aweborn/backups/sync
                type: DirectoryOrCreate
          initContainers:
            - name: fix-backup-perms
              image: busybox:1.36
              command: ["sh", "-c", "chown -R 1001:1001 /backups && chmod 755 /backups"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
          containers:
            - name: backup
              image: ghcr.io/aweborn/sync-service:latest
              imagePullPolicy: Never
              command: ["node", "dist/server/sync-service/src/backup.js"]
              env:
                - name: DB_PATH
                  value: /data/universe.db
                - name: BACKUP_DIR
                  value: /backups
                - name: KEEP_HOURLY
                  value: "48"
                - name: KEEP_DAILY
                  value: "30"
              volumeMounts:
                # Read-write only because SQLite WAL readers need the -shm
                # file; the job never writes to the source DB.
                - name: sync-data
                  mountPath: /data
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "10m"
                limits:
                  memory: "256Mi"
                  cpu: "250m"
