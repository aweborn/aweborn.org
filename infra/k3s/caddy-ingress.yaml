# Caddy reverse proxy — auto-TLS for sync.aweborn.org + api.aweborn.org
# Deployed as a DaemonSet with hostPort for direct 80/443 binding
# Requires k3s installed with --disable=traefik

apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: aweborn
data:
  Caddyfile: |
    # Global options
    {
      email admin@aweborn.org
    }

    # sync.aweborn.org — WebSocket reverse proxy to sync-service
    sync.aweborn.org {
      reverse_proxy sync-service:1234

      # Enable WebSocket support
      @websocket {
        header Connection *Upgrade*
        header Upgrade websocket
      }
    }

    # api.aweborn.org — HTTP reverse proxy to genai-service
    api.aweborn.org {
      reverse_proxy genai-service:3001
    }

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: caddy
  namespace: aweborn
  labels:
    app: caddy
spec:
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: caddy-data
              mountPath: /data
            - name: caddy-config-cache
              mountPath: /config
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: caddy-config
          configMap:
            name: caddy-config
        - name: caddy-data
          persistentVolumeClaim:
            claimName: caddy-data
        - name: caddy-config-cache
          emptyDir: {}
