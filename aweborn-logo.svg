<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Network Lines -->
  <g stroke="url(#lineGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer A Shape -->
    <line x1="150" y1="50" x2="50" y2="250" />
    <line x1="150" y1="50" x2="250" y2="250" />
    <!-- Horizontal Crossbar -->
    <line x1="100" y1="150" x2="200" y2="150" />
    <!-- Internal Network Connections -->
    <line x1="150" y1="50" x2="150" y2="110" />
    <line x1="150" y1="110" x2="100" y2="150" />
    <line x1="150" y1="110" x2="200" y2="150" />
    <line x1="150" y1="110" x2="150" y2="250" />
    <line x1="50" y1="250" x2="150" y2="250" />
    <line x1="250" y1="250" x2="150" y2="250" />
  </g>

  <!-- Nodes (Individuals & Cohorts) -->
  <g filter="url(#glow)">
    <!-- Apex Node (Awe / Purpose) -->
    <circle cx="150" cy="50" r="16" fill="#f59e0b" />
    <!-- Base Nodes -->
    <circle cx="50" cy="250" r="12" fill="#0ea5e9" />
    <circle cx="250" cy="250" r="12" fill="#0ea5e9" />
    <!-- Crossbar Nodes -->
    <circle cx="100" cy="150" r="10" fill="#6366f1" />
    <circle cx="200" cy="150" r="10" fill="#6366f1" />
    <!-- Central Hub Nodes (Data & Integration) -->
    <circle cx="150" cy="110" r="10" fill="#ec4899" />
    <circle cx="150" cy="250" r="12" fill="#0ea5e9" />
  </g>
</svg>
