# Aweborn — Local Development
# Usage: docker compose up  (from server/ directory)

services:
  sync-service:
    build:
      context: ..
      dockerfile: server/sync-service/Dockerfile
      target: builder # has dev deps (tsx) for hot-reload
    ports:
      - "1234:1234"
    environment:
      - PORT=1234
      - HOST=0.0.0.0
      - DB_PATH=/data/universe.db
      - GENAI_URL=http://genai-service:3001
      - MANA_ADMIN_TOKEN=${MANA_ADMIN_TOKEN:-dev-admin}  # local only; seed the dev pool via POST /api/mana/inflow
      - ASSET_FALLBACK_URL=https://sync.aweborn.org  # prod worlds pulled locally (scripts/dev/pull-prod-worlds.sh) load prod's models
    volumes:
      - ./sync-service/src:/app/server/sync-service/src
      - ./data:/data
      - ../shared:/app/shared
    # Override CMD with tsx watch for hot-reload in dev
    command: ["npx", "tsx", "watch", "src/index.ts"]
    # Run as root in dev so we can write to the volume-mounted data dir
    user: root
    restart: unless-stopped

  genai-service:
    build:
      context: ./genai-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - DATA_DIR=/data
      # Empty = stub provider (sample GLB). Put the real key in server/.env (gitignored).
      - MESHY_API_KEY=${MESHY_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - ./genai-service/src:/app/src
      - ./genai-data:/data
    user: root
    command: ["npx", "tsx", "watch", "src/index.ts"]
    restart: unless-stopped

  agent-runner:
    build:
      context: ./agent-runner
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-anthropic/claude-haiku-5.5}
    volumes:
      - ./agent-runner/src:/app/src
      - ./data/agent-runner:/app/data
    command: ["npx", "tsx", "watch", "src/index.ts"]
    user: root
    restart: unless-stopped
