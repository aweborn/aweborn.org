<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="200" fill="url(#g1)" rx="20"/>

  <!-- "aweborn" wordmark -->
  <text x="50" y="120" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="300" fill="#e2e8f0" letter-spacing="3">aweborn</text>

  <!-- Three spheres trail after the word like a living ellipsis -->
  <!-- Large -->
  <circle cx="440" cy="108" r="22" fill="#e2e8f0" opacity="0.9"/>
  <!-- Medium -->
  <circle cx="478" cy="94" r="16" fill="#cbd5e1" opacity="0.87"/>
  <!-- Small (highest, furthest) -->
  <circle cx="510" cy="76" r="11" fill="#f8fafc" opacity="0.95"/>

  <!-- Subtle arc -->
  <ellipse cx="476" cy="95" rx="45" ry="20" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.13" transform="rotate(-18 476 95)"/>
</svg>
