<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#g1)" rx="40"/>

  <!-- Subtle orbital arcs -->
  <ellipse cx="200" cy="220" rx="115" ry="46" fill="none" stroke="#94a3b8" stroke-width="0.8" opacity="0.16" transform="rotate(-8 200 220)"/>
  <ellipse cx="200" cy="210" rx="92" ry="38" fill="none" stroke="#94a3b8" stroke-width="0.8" opacity="0.12" transform="rotate(22 200 210)"/>

  <!-- Large: r=60 (smaller than original) -->
  <circle cx="258" cy="255" r="60" fill="#e2e8f0" opacity="0.9"/>
  <!-- Medium: r=52 (closer to large) -->
  <circle cx="132" cy="240" r="52" fill="#cbd5e1" opacity="0.87"/>
  <!-- Small: r=42 (also closer — more siblings-like) -->
  <circle cx="200" cy="140" r="42" fill="#f8fafc" opacity="0.95"/>
</svg>
