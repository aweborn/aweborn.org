<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#g1)" rx="40"/>

  <!-- Subtle orbital arcs (very thin, low opacity) -->
  <ellipse cx="200" cy="220" rx="110" ry="45" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.2" transform="rotate(-15 200 220)"/>
  <ellipse cx="200" cy="210" rx="90" ry="38" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.15" transform="rotate(25 200 210)"/>

  <!-- Largest sphere (bottom right) -->
  <circle cx="260" cy="255" r="65" fill="#e2e8f0" opacity="0.9"/>
  
  <!-- Medium sphere (left) -->
  <circle cx="132" cy="235" r="50" fill="#cbd5e1" opacity="0.85"/>
  
  <!-- Smallest sphere (top) — the bright one -->
  <circle cx="195" cy="148" r="38" fill="#f8fafc" opacity="0.95"/>
</svg>
