<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 980" width="820" height="980">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <!-- Arrowhead marker for dimension lines -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#fbbf24" stroke-width="1"/>
    </marker>
    <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#fbbf24" stroke-width="1"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#22d3ee" stroke-width="1"/>
    </marker>
    <marker id="arrow-cyan-rev" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#22d3ee" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="980" fill="url(#bg)" rx="24"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- TITLE                                   -->
  <!-- ═══════════════════════════════════════ -->
  <text x="410" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="300" fill="#f8fafc" letter-spacing="4">CONSTRUCTION</text>
  <text x="410" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="300" fill="#94a3b8" letter-spacing="2">FIBONACCI RADII · TANGENT TRIANGLE · 82% OVERLAP · 15° ROTATION</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- FIBONACCI SEQUENCE                      -->
  <!-- ═══════════════════════════════════════ -->
  <text x="410" y="125" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#64748b">
    1, 1, 2, 3, 5, 8, 13,
  </text>
  <!-- Highlighted Fibonacci numbers used -->
  <text x="410" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#64748b">
    <tspan fill="#fbbf24" font-weight="bold">21</tspan><tspan>, </tspan>
    <tspan fill="#fbbf24" font-weight="bold">34</tspan><tspan>, </tspan>
    <tspan fill="#fbbf24" font-weight="bold">55</tspan><tspan fill="#64748b">, </tspan>
    <tspan fill="#fbbf24" font-weight="bold">89</tspan><tspan fill="#64748b">, 144, 233 …</tspan>
  </text>
  <text x="410" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569" letter-spacing="1">↑ RADII              ↑ TANGENT DISTANCES</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- STEP 1: THE THREE CIRCLES               -->
  <!--   Fibonacci radii: 21, 34, 55           -->
  <!--   (drawn at 1.5× for visibility)        -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Ghost tangent positions (where circles would be if just touching) -->
  <circle cx="352" cy="420" r="83" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>
  <circle cx="480" cy="455" r="51" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>
  <circle cx="456" cy="375" r="32" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>

  <!-- Actual overlapping circles (semi-transparent to show overlap) -->
  <!-- Largest (r=55 → 83px) -->
  <circle cx="366" cy="417" r="83" fill="#d4d4d8" opacity="0.35" stroke="#d4d4d8" stroke-width="1.5"/>
  <!-- Medium (r=34 → 51px) -->
  <circle cx="471" cy="446" r="51" fill="#a1a1aa" opacity="0.4" stroke="#a1a1aa" stroke-width="1.5"/>
  <!-- Smallest (r=21 → 32px) -->
  <circle cx="451" cy="380" r="32" fill="#ffffff" opacity="0.5" stroke="#ffffff" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- CENTER POINTS                           -->
  <!-- ═══════════════════════════════════════ -->
  <circle cx="366" cy="417" r="3" fill="#fbbf24"/>
  <circle cx="471" cy="446" r="3" fill="#fbbf24"/>
  <circle cx="451" cy="380" r="3" fill="#fbbf24"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- RADIUS ANNOTATIONS (golden/amber)       -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Largest radius line — going left from center -->
  <line x1="366" y1="417" x2="283" y2="417" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,3" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="318" y="408" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#fbbf24">r = 55</text>

  <!-- Medium radius line — going right from center -->
  <line x1="471" y1="446" x2="522" y2="446" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,3" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="505" y="465" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#fbbf24">r = 34</text>

  <!-- Smallest radius line — going up from center -->
  <line x1="451" y1="380" x2="451" y2="348" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,3" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="476" y="358" text-anchor="start" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#fbbf24">r = 21</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- INTER-CENTER DISTANCES (cyan)           -->
  <!-- ═══════════════════════════════════════ -->

  <!-- L ↔ M distance -->
  <line x1="366" y1="417" x2="471" y2="446" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
  <text x="408" y="445" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#22d3ee">
    <tspan>73</tspan>
  </text>
  <text x="408" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0e7490">(tangent: 89)</text>

  <!-- L ↔ S distance -->
  <line x1="366" y1="417" x2="451" y2="380" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
  <text x="396" y="390" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#22d3ee">62</text>
  <text x="396" y="403" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0e7490">(tangent: 76)</text>

  <!-- M ↔ S distance -->
  <line x1="471" y1="446" x2="451" y2="380" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
  <text x="475" y="410" text-anchor="start" font-family="'Courier New', monospace" font-size="12" fill="#22d3ee">45</text>
  <text x="475" y="423" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" fill="#0e7490">(tangent: 55)</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- TANGENT DISTANCE CALLOUT (right side)   -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="570" y="330" width="220" height="175" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="680" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">TANGENT DISTANCES</text>
  <line x1="590" y1="366" x2="770" y2="366" stroke="#334155" stroke-width="1"/>
  <text x="590" y="390" font-family="'Courier New', monospace" font-size="13" fill="#e2e8f0">55 + 34 = <tspan fill="#fbbf24" font-weight="bold">89</tspan>  <tspan fill="#22d3ee" font-size="11">← F(11)!</tspan></text>
  <text x="590" y="414" font-family="'Courier New', monospace" font-size="13" fill="#e2e8f0">55 + 21 = <tspan fill="#e2e8f0">76</tspan></text>
  <text x="590" y="438" font-family="'Courier New', monospace" font-size="13" fill="#e2e8f0">34 + 21 = <tspan fill="#fbbf24" font-weight="bold">55</tspan>  <tspan fill="#22d3ee" font-size="11">← F(10)!</tspan></text>
  <line x1="590" y1="452" x2="770" y2="452" stroke="#334155" stroke-width="1"/>
  <text x="590" y="474" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">When circles touch, 2 of 3</text>
  <text x="590" y="490" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">distances are Fibonacci numbers</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- GOLDEN RATIO CALLOUT (left side)        -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="30" y="330" width="220" height="175" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="140" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">GOLDEN RATIO φ</text>
  <line x1="50" y1="366" x2="230" y2="366" stroke="#334155" stroke-width="1"/>
  <text x="50" y="394" font-family="'Courier New', monospace" font-size="15" fill="#e2e8f0">34 ÷ 21 = <tspan fill="#fbbf24" font-weight="bold">1.619…</tspan></text>
  <text x="50" y="420" font-family="'Courier New', monospace" font-size="15" fill="#e2e8f0">55 ÷ 34 = <tspan fill="#fbbf24" font-weight="bold">1.617…</tspan></text>
  <line x1="50" y1="436" x2="230" y2="436" stroke="#334155" stroke-width="1"/>
  <text x="140" y="460" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#fbbf24">φ ≈ 1.61803…</text>
  <text x="140" y="484" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Each radius is φ× the previous</text>
  <text x="140" y="498" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">(the golden ratio)</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- GHOST/TANGENT ANNOTATION                -->
  <!-- ═══════════════════════════════════════ -->
  <line x1="250" y1="548" x2="310" y2="510" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="195" y="565" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Dashed = tangent positions</text>
  <text x="195" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">(circles just touching)</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- CONSTRUCTION STEPS (bottom)             -->
  <!-- ═══════════════════════════════════════ -->
  <line x1="60" y1="640" x2="760" y2="640" stroke="#1e293b" stroke-width="2"/>
  <text x="410" y="672" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="300" fill="#f8fafc" letter-spacing="3">CONSTRUCTION</text>

  <!-- Step 1 -->
  <rect x="50" y="698" width="160" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="130" y="722" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fbbf24" letter-spacing="1">STEP 1</text>
  <text x="130" y="742" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">Choose 3 consecutive</text>
  <text x="130" y="758" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">Fibonacci numbers</text>
  <text x="130" y="785" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#fbbf24" font-weight="bold">21, 34, 55</text>

  <!-- Step 2 -->
  <text x="225" y="750" font-family="system-ui, sans-serif" font-size="20" fill="#475569">→</text>
  <rect x="240" y="698" width="160" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="320" y="722" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fbbf24" letter-spacing="1">STEP 2</text>
  <text x="320" y="742" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">Arrange as mutually</text>
  <text x="320" y="758" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">tangent circles</text>
  <text x="320" y="785" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">(all 3 touching)</text>

  <!-- Step 3 -->
  <text x="415" y="750" font-family="system-ui, sans-serif" font-size="20" fill="#475569">→</text>
  <rect x="430" y="698" width="160" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="510" y="722" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fbbf24" letter-spacing="1">STEP 3</text>
  <text x="510" y="742" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">Scale triangle to</text>
  <text x="510" y="758" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#fbbf24" font-weight="bold">82%</text>
  <text x="510" y="785" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">(≈18% overlap)</text>

  <!-- Step 4 -->
  <text x="605" y="750" font-family="system-ui, sans-serif" font-size="20" fill="#475569">→</text>
  <rect x="620" y="698" width="160" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="700" y="722" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fbbf24" letter-spacing="1">STEP 4</text>
  <text x="700" y="742" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">Rotate entire</text>
  <text x="700" y="758" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">arrangement by</text>
  <text x="700" y="785" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#fbbf24" font-weight="bold">15°</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- BOTTOM: WHY IT MATTERS                  -->
  <!-- ═══════════════════════════════════════ -->
  <line x1="60" y1="840" x2="760" y2="840" stroke="#1e293b" stroke-width="1"/>
  <text x="410" y="870" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" letter-spacing="1">
    The same ratio that arranges sunflower seeds, nautilus chambers, and galaxy arms
  </text>
  <text x="410" y="892" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" letter-spacing="1">
    is embedded in the relationship between these three circles.
  </text>

  <text x="410" y="930" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#475569" font-style="italic">
    Three individuals. Different scales. Mathematically bound.
  </text>
  <text x="410" y="955" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#475569" font-style="italic">
    Remove one and the ratio breaks.
  </text>
</svg>
