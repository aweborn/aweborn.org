<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Aweborn worlds (admin) | Aweborn</title>
    <meta name="description" content="Admin only: take over one of Aweborn's own worlds." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; --bg: #050510; --glass: rgba(10, 10, 46, 0.6); --border: rgba(238, 240, 246, 0.12); --text: #eef0f6; --dim: rgba(238, 240, 246, 0.55); --accent: #e8b94a; --danger: #ff9a86; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(1200px 600px at 20% -10%, #12124a 0%, var(--bg) 60%); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 560px; margin: 0 auto; padding: 32px 20px 80px; }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
      .sub { color: var(--dim); margin: 0 0 24px; }
      form { display: flex; flex-direction: column; gap: 10px; }
      label { font-size: 13px; color: var(--dim); }
      input { font: inherit; font-size: 16px; color: var(--text); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; outline: none; }
      input:focus { border-color: var(--accent); }
      button { min-height: 44px; font: inherit; font-weight: 600; color: #1a1206; border: none; border-radius: 999px; padding: 10px 16px; cursor: pointer; background: linear-gradient(135deg, #ffd27a, #ff9f5a); }
      button:disabled { opacity: 0.6; cursor: progress; }
      .msg { min-height: 1.4em; margin: 16px 0 0; color: var(--dim); }
      .msg.err { color: var(--danger); }
      .msg.ok { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Take over an Aweborn world</h1>
      <p class="sub">
        Makes the player you're signed in as (in this browser) the creator of one of Aweborn's own worlds, like Lost.
        Then it works like any player's world: you shape it, add builders and answer asks to build. Origin and
        players' worlds can't be taken over.
      </p>
      <form id="claim" autocomplete="off">
        <label for="claim-token">Admin token</label>
        <input id="claim-token" type="password" autocomplete="off" />
        <label for="claim-world">World link or ID (World Index → the world → Copy link)</label>
        <input id="claim-world" type="text" inputmode="url" autocomplete="off" placeholder="https://aweborn.org/w/…" />
        <button type="submit" id="claim-go">Make me its creator</button>
      </form>
      <p class="msg" id="claim-msg" role="status"></p>
    </main>
    <script>
      const API = location.hostname === 'localhost' ? 'http://localhost:1234' : 'https://sync.aweborn.org'
      const $ = (id) => document.getElementById(id)
      const tokenEl = $('claim-token'), worldEl = $('claim-world'), msg = $('claim-msg'), go = $('claim-go')
      tokenEl.value = sessionStorage.getItem('aweborn-admin') || ''

      function say(text, kind) { msg.textContent = text; msg.className = 'msg' + (kind ? ' ' + kind : '') }

      $('claim').onsubmit = async (e) => {
        e.preventDefault()
        const worldId = (worldEl.value.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i) || [])[0]
        if (!worldId) return say('Paste the world’s link or ID.', 'err')
        sessionStorage.setItem('aweborn-admin', tokenEl.value.trim())
        go.disabled = true
        say('Working…')
        try {
          const res = await fetch(API + '/api/player/world/claim', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ worldId: worldId.toLowerCase(), token: tokenEl.value.trim() }),
          })
          const j = await res.json().catch(() => ({}))
          if (res.status === 401 && !j.message) throw new Error('Not signed in to the game in this browser. Open aweborn.org here first.')
          if (!res.ok) throw new Error(j.message || j.error || 'Failed (' + res.status + ')')
          say('Done: ' + (j.name || 'the world') + ' is yours now. Reload the game to see it.', 'ok')
        } catch (err) {
          say(err.message, 'err')
        } finally {
          go.disabled = false
        }
      }
    </script>
  </body>
</html>
