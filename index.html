<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Installed web app (Add to Home Screen): no browser UI, full bleed -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aweborn" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- SEO -->
    <title>Aweborn — Support Our Mission</title>
    <meta name="description" content="Aweborn is a non-profit dedicated to inspiring awe and positive change. Explore our immersive 3D cosmos and support our mission with a donation." />
    <meta name="theme-color" content="#050510" />

    <!-- Open Graph -->
    <meta property="og:title" content="Aweborn — Support Our Mission" />
    <meta property="og:description" content="Explore an immersive cosmic experience and support the Aweborn non-profit mission." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aweborn.org" />
    <meta property="og:image" content="https://aweborn.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aweborn — Support Our Mission" />
    <meta name="twitter:description" content="Explore an immersive cosmic experience and support the Aweborn non-profit mission." />
    <meta name="twitter:image" content="https://aweborn.org/og-image.png" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
