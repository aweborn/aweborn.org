name: Deploy

# Push to main → deploy whichever VPS services changed (sync-service,
# genai-service, agent-runner, caddy) over an ephemeral Tailscale node →
# deploy the frontend to S3/CloudFront.
# Servers always go first so a new client never talks to an old server.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      services:
        description: "VPS services to deploy (space-separated: sync-service genai-service agent-runner caddy, or 'all'; 'none' = frontend only)"
        type: string
        default: all

# Never run two production deploys at once; queue instead of cancelling.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Filter names must match deploy-services.sh service names.
          # (Deploy-script-only changes don't trigger a deploy.)
          filters: |
            sync-service:
              - 'server/sync-service/**'
              - 'shared/**'
              - 'infra/k3s/sync-service-deployment.yaml'
              - '.dockerignore'
            genai-service:
              - 'server/genai-service/**'
              - 'infra/k3s/genai-service-deployment.yaml'
            agent-runner:
              - 'server/agent-runner/**'
              - 'infra/k3s/agent-runner-deployment.yaml'
            caddy:
              - 'infra/k3s/caddy-ingress.yaml'
              - 'infra/k3s/caddy-pvc.yaml'

      - name: Resolve services to deploy
        id: list
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          REQUESTED: ${{ inputs.services }}
        run: |
          all="sync-service genai-service agent-runner caddy"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            list="$REQUESTED"
          else
            list="$(jq -r 'join(" ")' <<<"$CHANGED")"
          fi
          [[ " $list " == *" all "* ]] && list="$all"
          [[ "$list" == "none" ]] && list=""
          for s in $list; do
            [[ " $all " == *" $s "* ]] || { echo "::error::unknown service '$s'"; exit 1; }
          done
          echo "Services to deploy: ${list:-<none>}"
          echo "services=$list" >> "$GITHUB_OUTPUT"

  deploy-server:
    needs: changes
    if: needs.changes.outputs.services != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # Tailscale workload identity federation (no long-lived secret)
      contents: read
    env:
      SERVICES: ${{ needs.changes.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/*/package-lock.json

      - name: Test + typecheck changed services
        run: |
          for s in $SERVICES; do
            [[ "$s" == "caddy" ]] && continue # Caddyfile is validated on the VPS
            echo "::group::$s"
            if [[ "$s" == "sync-service" ]]; then node --test shared/crdt-schema.test.ts; fi
            (cd "server/$s" && npm ci && npx tsc --noEmit)
            echo "::endgroup::"
          done

      - name: Check deploy credentials
        id: creds
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [[ -z "$TS_OAUTH_CLIENT_ID" || -z "$TS_AUDIENCE" || -z "$VPS_SSH_KEY" ]]; then
            echo "::warning title=VPS services NOT deployed::Missing TS_OAUTH_CLIENT_ID / TS_AUDIENCE / VPS_SSH_KEY secrets. See HANDOFF.md → CI server deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Join Tailnet (ephemeral node, tag:ci)
        if: steps.creds.outputs.ready == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Deploy services on VPS
        if: steps.creds.outputs.ready == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # Host key of aweborn-vps (public; pinned so we never trust-on-first-use).
          VPS_KNOWN_HOST: aweborn-vps ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE7Q5wnApGOQP6ThcuEKn03NQ3/rzzg+U8rYq0NcGpiT
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOST" > ~/.ssh/known_hosts
          # The key is restricted on the VPS to a forced command that runs
          # infra/k3s/deploy-services.sh; the service list we send arrives as
          # $SSH_ORIGINAL_COMMAND and is validated there. No shell, no forwarding.
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            ubuntu@aweborn-vps "$SERVICES"

  deploy-frontend:
    needs: [changes, deploy-server]
    # Run when the server deploy succeeded or wasn't needed; never after a failed one.
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Deploy static site to S3 bucket
        run: |
          aws s3 sync ./dist/ s3://aweborn-website-content --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths '/*'
